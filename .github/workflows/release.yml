name: Release artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate
        id: resolve
        run: |
          CONFIG_VERSION=$(awk '/^  version:/ { gsub(/["'"'"']/, "", $2); print $2; exit }' build/config.yml)
          echo "build/config.yml info.version: ${CONFIG_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION}" != "${CONFIG_VERSION}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} says ${VERSION} but build/config.yml says ${CONFIG_VERSION}. Bump the config on main and re-tag; the About box reads the config value."
              exit 1
            fi
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # Unsigned/development builds resolve their version in the macOS
            # metadata step below.
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify source before packaging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Keep parity with ci.yml's backend job: the Linux runner has no
      # gtk4/webkitgtk headers, while server mode is pure Go.
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # TestGitService inspects the repository itself (HEAD~1 ranges, tags);
          # the default shallow checkout has only one grafted commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: configure git identity for tests
        run: |
          git config --global user.name "wgit CI"
          git config --global user.email "ci@wgit.local"
          git config --global commit.gpgsign false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: shellcheck (packaging scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -S info -s bash "${files[@]}"
          else
            echo "no shell scripts to lint"
          fi

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # main.go embeds frontend/dist; a clean checkout has no dist directory.
      - name: satisfy the frontend embed directive
        run: mkdir -p frontend/dist && touch frontend/dist/.ci-placeholder

      - name: go vet
        run: go vet -tags server ./...

      - name: go test
        run: go test -tags server ./... -count=1

      - name: install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: typecheck
        working-directory: frontend
        run: bun run typecheck

      # finalDeliveryVerification.test.ts and the bundle budget both need dist.
      - name: build frontend bundle
        working-directory: frontend
        run: bun run build

      - name: frontend tests
        working-directory: frontend
        run: bun test tests

  macos:
    name: macOS DMG (universal)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [version, verify]
    env:
      # Empty on forks and until the Apple credentials are configured; the
      # inline sign step then ad-hoc signs and labels the artifact as not
      # distributable, so the packaging chain stays observable either way.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The metadata step reads the tag for the version string.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build

      - name: Resolve build metadata
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # A main-push smoke build pays for one slice; a tag ships the
          # universal binary.
          ARCHS: ${{ startsWith(github.ref, 'refs/tags/v') && 'arm64 amd64' || 'arm64' }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONFIG_VERSION="$(awk '/^  version:/ { gsub(/["'"'"']/, "", $2); print $2; exit }' build/config.yml)"
          CONFIG_VERSION="${CONFIG_VERSION:-0.0.0}"
          if [ -z "${VERSION}" ]; then
            if TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
              VERSION="${TAG#v}"
            else
              VERSION="${CONFIG_VERSION}-dev.${COMMIT}"
            fi
          fi
          ARCH_LIST="$(echo "${ARCHS}" | tr -s ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          [ -n "${ARCH_LIST}" ] || { echo "::error::ARCHS is empty"; exit 1; }
          for arch in ${ARCH_LIST}; do
            case "${arch}" in
              arm64 | amd64) ;;
              *) echo "::error::unsupported ARCHS entry '${arch}'"; exit 1 ;;
            esac
          done
          case "${ARCH_LIST}" in
            *" "*) UNIARCH=true; ARCH_LABEL=universal ;;
            *) UNIARCH=false; ARCH_LABEL="${ARCH_LIST}" ;;
          esac
          DMG_NAME="wgit-${VERSION}-darwin-${ARCH_LABEL}.dmg"
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "build_date=${BUILD_DATE}"
            echo "archs=${ARCH_LIST}"
            echo "uniarch=${UNIARCH}"
            echo "arch_label=${ARCH_LABEL}"
            echo "dmg_name=${DMG_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and bundle app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          ARCHS: ${{ steps.meta.outputs.archs }}
          UNIARCH: ${{ steps.meta.outputs.uniarch }}
          ARCH_LABEL: ${{ steps.meta.outputs.arch_label }}
        run: |
          set -euo pipefail
          [ -n "$(ls -A frontend/dist 2>/dev/null)" ] || { echo "::error::frontend/dist is empty"; exit 1; }
          mkdir -p bin dist
          LDFLAGS="-s -w -X main.AppVersion=${VERSION} -X main.CommitHash=${COMMIT} -X main.BuildDate=${BUILD_DATE}"
          for arch in ${ARCHS}; do
            echo "==> Compiling darwin/${arch} (-tags production embeds frontend/dist)"
            CGO_ENABLED=1 GOOS=darwin GOARCH="${arch}" \
              CGO_CFLAGS="-mmacosx-version-min=12.0" \
              CGO_LDFLAGS="-mmacosx-version-min=12.0" \
              MACOSX_DEPLOYMENT_TARGET="12.0" \
              go build -tags production -trimpath -buildvcs=false -ldflags "${LDFLAGS}" \
                -o "bin/wgit-${arch}" .
          done
          if [ "${UNIARCH}" = "true" ]; then
            lipo -create -output bin/wgit bin/wgit-amd64 bin/wgit-arm64
            rm -f bin/wgit-amd64 bin/wgit-arm64
          else
            mv "bin/wgit-${ARCHS}" bin/wgit
          fi
          APP_DIR="bin/wgit.app"
          rm -rf "${APP_DIR}"
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
          cp bin/wgit "${APP_DIR}/Contents/MacOS/wgit"
          chmod +x "${APP_DIR}/Contents/MacOS/wgit"
          cp build/darwin/Info.plist "${APP_DIR}/Contents/Info.plist"
          cp build/darwin/icons.icns "${APP_DIR}/Contents/Resources/icons.icns"
          if [ -f build/darwin/Assets.car ]; then
            cp build/darwin/Assets.car "${APP_DIR}/Contents/Resources/Assets.car"
          fi
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "${APP_DIR}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${COMMIT}" "${APP_DIR}/Contents/Info.plist"
          plutil -lint "${APP_DIR}/Contents/Info.plist" >/dev/null
          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "buildDate": "%s",\n  "arch": "%s",\n  "bundleId": "com.wgit.app"\n}\n' \
            "${VERSION}" "${COMMIT}" "${BUILD_DATE}" "${ARCH_LABEL}" \
            > "${APP_DIR}/Contents/Resources/build-info.json"

      - name: Sign, notarize, and package DMG
        env:
          DMG_NAME: ${{ steps.meta.outputs.dmg_name }}
          ENTITLEMENTS: build/darwin/entitlements.plist
        run: |
          set -euo pipefail
          APP_DIR="bin/wgit.app"
          IDENTITY="${APPLE_SIGNING_IDENTITY:-}"
          NOTARIZE="${NOTARIZE:-auto}"
          log() { echo "==> $*"; }
          die() { echo "Error: $*" >&2; exit 1; }

          WORK_DIR="$(mktemp -d "${TMPDIR:-/tmp}/wgit-sign.XXXXXX")"
          STAGING=""
          KEYCHAIN=""
          P8_FILE=""
          EXISTING_KEYCHAINS=()
          cleanup() {
            if [ -n "${STAGING}" ]; then
              rm -rf "${STAGING}" 2>/dev/null || true
            fi
            if [ -n "${KEYCHAIN}" ]; then
              security delete-keychain "${KEYCHAIN}" >/dev/null 2>&1 || true
              if [ ${#EXISTING_KEYCHAINS[@]} -gt 0 ]; then
                security list-keychains -d user -s "${EXISTING_KEYCHAINS[@]}" >/dev/null 2>&1 || true
              fi
            fi
            if [ -n "${P8_FILE}" ]; then
              rm -f "${P8_FILE}" 2>/dev/null || true
            fi
            rm -rf "${WORK_DIR}"
          }
          trap cleanup EXIT

          if [ -n "${IDENTITY}" ] && [ -n "${APPLE_CERT_P12_BASE64:-}" ]; then
            log "Importing the Developer ID certificate into a temporary keychain"
            while IFS= read -r line; do
              trimmed="$(printf '%s' "${line}" | tr -d '\"' | sed -e 's/^ *//' -e 's/[ \t]*$//')"
              [ -n "${trimmed}" ] && EXISTING_KEYCHAINS+=("${trimmed}")
            done < <(security list-keychains -d user 2>/dev/null || true)
            KEYCHAIN="${WORK_DIR}/wgit-sign.keychain-db"
            KEYCHAIN_PASSWORD="${APPLE_KEYCHAIN_PASSWORD:-$(openssl rand -hex 16)}"
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            echo "${APPLE_CERT_P12_BASE64}" | base64 --decode > "${WORK_DIR}/developer.p12"
            security import "${WORK_DIR}/developer.p12" -P "${APPLE_CERT_PASSWORD:-}" \
              -A -f pkcs12 -k "${KEYCHAIN}" >/dev/null
            # Without this, codesign asks for an interactive ACL unlock on a headless runner.
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
            security list-keychains -d user -s "${KEYCHAIN}" "${EXISTING_KEYCHAINS[@]}"
          fi

          NOTARY_ARGS=()
          if [ -n "${IDENTITY}" ]; then
            if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
              P8_FILE="${WORK_DIR}/AuthKey.p8"
              echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "${P8_FILE}"
              chmod 600 "${P8_FILE}"
            fi
            P8_FILE="${P8_FILE:-${APPLE_API_KEY_FILE:-}}"
            if [ -n "${P8_FILE}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
              NOTARY_ARGS=(--key "${P8_FILE}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}")
            elif [ -n "${APPLE_NOTARY_PROFILE:-}" ]; then
              NOTARY_ARGS=(--keychain-profile "${APPLE_NOTARY_PROFILE}")
            fi
          fi

          sign_and_notarize() {
            TARGET="$1"
            case "${TARGET}" in
              *.app)
                TARGET_KIND=app
                [ -f "${ENTITLEMENTS}" ] || die "entitlements file missing: ${ENTITLEMENTS}"
                ;;
              *.dmg) TARGET_KIND=dmg ;;
              *) die "unsupported target type (expected .app or .dmg): ${TARGET}" ;;
            esac

            if [ -z "${IDENTITY}" ]; then
              if [ "${TARGET_KIND}" = app ]; then
                log "No APPLE_SIGNING_IDENTITY: ad-hoc signing (local testing only)"
                codesign --force --sign - --entitlements "${ENTITLEMENTS}" "${TARGET}"
              else
                log "No APPLE_SIGNING_IDENTITY: leaving ${TARGET} unsigned"
              fi
              echo "[UNSIGNED] Set APPLE_SIGNING_IDENTITY (and notary credentials) for a distributable artifact."
              return 0
            fi

            TEAM_ID="${APPLE_TEAM_ID:-$(printf '%s' "${IDENTITY}" | sed -nE 's/.*\(([A-Z0-9]+)\)$/\1/p')}"
            local SUBMIT_TARGET=""
            if [ "${TARGET_KIND}" = app ]; then
              log "Signing the inner executable, then the bundle (hardened runtime)"
              # Signing the bundle after its executable beats the deprecated --deep walk.
              codesign --force --timestamp --options runtime --entitlements "${ENTITLEMENTS}" \
                --sign "${IDENTITY}" "${TARGET}/Contents/MacOS"/*
              codesign --force --timestamp --options runtime --entitlements "${ENTITLEMENTS}" \
                --sign "${IDENTITY}" "${TARGET}"
              SUBMIT_TARGET="${WORK_DIR}/$(basename "${TARGET}" .app).zip"
              ditto -c -k --keepParent "${TARGET}" "${SUBMIT_TARGET}"
            else
              log "Signing the disk image"
              codesign --force --timestamp --sign "${IDENTITY}" "${TARGET}"
              SUBMIT_TARGET="${TARGET}"
            fi

            log "Verifying the signature"
            codesign --verify --strict --verbose=2 "${TARGET}"

            if [ "${NOTARIZE}" = false ]; then
              echo "WARNING: NOTARIZE=false - Gatekeeper will block this artifact outside the build machine."
              return 0
            fi

            if [ ${#NOTARY_ARGS[@]} -eq 0 ]; then
              if [ "${NOTARIZE}" = true ]; then
                die "NOTARIZE=true but no notary credentials (APPLE_API_KEY_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_NOTARY_PROFILE)"
              fi
              echo "WARNING: signed but not notarized (no notary credentials found)."
              return 0
            fi

            log "Submitting to Apple notary service"
            RESULT_JSON="${WORK_DIR}/notary-$(basename "${TARGET}").json"
            # --wait exits non-zero on rejection; the JSON still carries the id
            # needed for Apple's diagnostic log, so judge by the status field.
            xcrun notarytool submit "${SUBMIT_TARGET}" "${NOTARY_ARGS[@]}" --wait --output-format json > "${RESULT_JSON}" || true
            local STATUS ID
            read -r STATUS ID < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status","Unknown"), d.get("id",""))' "${RESULT_JSON}" 2>/dev/null || printf 'Unreadable unknown\n')
            if [ "${STATUS}" != "Accepted" ]; then
              echo "Notarization status: ${STATUS} (submission ${ID:-unknown})" >&2
              if [ -n "${ID:-}" ] && [ "${ID}" != "unknown" ]; then
                xcrun notarytool log "${ID}" "${NOTARY_ARGS[@]}" || true
              fi
              die "notarization failed for ${TARGET}"
            fi

            log "Stapling the notarization ticket"
            xcrun stapler staple "${TARGET}"
            xcrun stapler validate "${TARGET}"

            log "Gatekeeper assessment"
            if spctl -a -vvv -t install "${TARGET}"; then
              echo "    accepted"
            else
              die "Gatekeeper rejected ${TARGET}"
            fi
            echo " Signed and notarized: ${TARGET}"
            echo " Team: ${TEAM_ID:-unknown}"
          }

          mkdir -p dist
          sign_and_notarize "${APP_DIR}"
          STAGING="$(mktemp -d "${TMPDIR:-/tmp}/wgit-dmg.XXXXXX")"
          cp -R "${APP_DIR}" "${STAGING}/wgit.app"
          ln -s /Applications "${STAGING}/Applications"
          rm -f "dist/${DMG_NAME}"
          hdiutil create -volname wgit -srcfolder "${STAGING}" -ov -format UDZO "dist/${DMG_NAME}"
          hdiutil verify "dist/${DMG_NAME}" >/dev/null
          sign_and_notarize "dist/${DMG_NAME}"
          (
            cd dist
            shasum -a 256 "${DMG_NAME}" | tee sha256sums.txt
          )
          echo "SHA-256: $(shasum -a 256 "dist/${DMG_NAME}" | cut -d' ' -f1)"

      - name: Artifact gates
        run: |
          (cd dist && shasum -a 256 -c sha256sums.txt)
          dmg=$(find dist -name '*.dmg' -type f | head -1)
          size=$(wc -c < "$dmg")
          echo "dmg: ${dmg} (${size} bytes)"
          # Measured 16.7 MB for the universal build; a jump past this ceiling
          # means an asset got duplicated into the bundle, not that the app grew.
          if [ "$size" -gt 40000000 ]; then
            echo "::error::DMG exceeded 40 MB"
            exit 1
          fi

      - name: Signature status
        run: |
          {
            echo "artifact: $(find dist -name '*.dmg' -type f)"
            codesign -dvv bin/wgit.app 2>&1 || true
            xcrun stapler validate dist/*.dmg 2>&1 || echo "no stapled ticket: artifact is NOT notarized"
            spctl -a -vvv -t install dist/*.dmg 2>&1 || echo "Gatekeeper: rejected (expected for an unsigned build)"
          } > dist/signature-status.txt
          cat dist/signature-status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wgit-macos-dmg
          path: |
            dist/*.dmg
            dist/sha256sums.txt
            dist/signature-status.txt
          retention-days: 30
          if-no-files-found: error

      # Upload first so a failed tag build still leaves the DMG and signature
      # report downloadable. A Developer ID signature without a notarization
      # ticket is still blocked by Gatekeeper, so the job must fail here.
      - name: Require notarization when signing is configured
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          xcrun stapler validate dist/*.dmg
          spctl -a -vvv -t install dist/*.dmg

  server:
    name: Server binary (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: build frontend bundle
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # Server mode is pure Go (no WebKit), so CGO stays off and the binary
        # runs on the distroless base image in Dockerfile.server.
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="${VERSION:-$(git describe --tags --always)}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -tags server,production -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.AppVersion=${VERSION} -X main.CommitHash=${COMMIT} -X main.BuildDate=${BUILT}" \
            -o "dist/wgit-server-linux-${{ matrix.arch }}" .
          cp build/docker/Dockerfile.server dist/
          (
            cd dist || exit 1
            tar czf "wgit-server-linux-${{ matrix.arch }}.tar.gz" \
              "wgit-server-linux-${{ matrix.arch }}" Dockerfile.server
            # The release job also runs on Ubuntu; sha256sum is part of coreutils
            # and avoids relying on the optional Perl shasum shim.
            sha256sum "wgit-server-linux-${{ matrix.arch }}.tar.gz" >> sha256sums.txt
            sha256sum -c sha256sums.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: wgit-server-linux-${{ matrix.arch }}
          path: |
            dist/wgit-server-linux-${{ matrix.arch }}.tar.gz
            dist/sha256sums.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, verify, macos, server]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wgit-*"
          path: artifacts

      - name: Assemble
        run: |
          set -euo pipefail
          # Verify each packaging job's own checksum before merging; a corrupted
          # download must fail here, not after the release is published.
          while IFS= read -r sums; do
            (cd "$(dirname "$sums")" && sha256sum -c sha256sums.txt)
          done < <(find artifacts -name sha256sums.txt -type f)

          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' \) -exec cp {} release/ \;
          dmg_count=$(find release -maxdepth 1 -name '*.dmg' -type f | wc -l | tr -d ' ')
          tar_count=$(find release -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')
          [ "$dmg_count" -eq 1 ] || { echo "::error::expected exactly one DMG, got ${dmg_count}"; exit 1; }
          [ "$tar_count" -eq 2 ] || { echo "::error::expected two Linux server tarballs, got ${tar_count}"; exit 1; }
          sig=$(find artifacts -name signature-status.txt -type f | head -1)
          [ -n "$sig" ] || { echo "::error::signature-status.txt is missing"; exit 1; }
          cp "$sig" release/signature-status.txt
          {
            echo "version: ${GITHUB_REF_NAME#v}"
            echo "tag: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/build-metadata.txt

          cd release
          sha256sum ./*.dmg ./*.tar.gz > sha256sums.txt
          sha256sum -c sha256sums.txt
          {
            echo "## wgit ${GITHUB_REF_NAME}"
            echo
            echo "| artifact | purpose |"
            echo "| --- | --- |"
            echo "| \`$(find . -maxdepth 1 -name '*.dmg' -printf '%f\n' | head -1)\` | macOS desktop app (drag to Applications) |"
            echo "| \`wgit-server-linux-*.tar.gz\` | headless server mode + \`Dockerfile.server\` |"
            echo
            echo "Verification: \`sha256sum -c sha256sums.txt\` on Linux, \`shasum -a 256 -c sha256sums.txt\` on macOS."
            echo
            echo "### Signature"
            echo
            echo '```'
            cat signature-status.txt
            echo '```'
            echo
            echo "### Build metadata"
            echo
            echo '```'
            cat build-metadata.txt
            echo '```'
            echo
            echo "Data lives in \`~/Library/Application Support/wgit/\` plus the WebView container;"
            echo "deleting the app and that directory is a complete uninstall."
          } > RELEASE_NOTES.md
          ls -lh
          cat RELEASE_NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repository from a
          # git remote; GITHUB_REPOSITORY is the only stable source here.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRE=""
          case "${GITHUB_REF_NAME}" in
            *-rc.* | *-beta* | *-alpha*) PRE="--prerelease" ;;
          esac
          ASSETS=(release/*.dmg release/*.tar.gz release/sha256sums.txt release/build-metadata.txt release/signature-status.txt)
          # Re-running a tag workflow must converge: upload over an existing
          # release instead of failing on "release already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
            if [ -n "${PRE}" ]; then
              gh release edit "${GITHUB_REF_NAME}" --notes-file release/RELEASE_NOTES.md --prerelease
            else
              gh release edit "${GITHUB_REF_NAME}" --notes-file release/RELEASE_NOTES.md
            fi
          else
            gh release create "${GITHUB_REF_NAME}" ${PRE} \
              --title "wgit ${GITHUB_REF_NAME}" \
              --notes-file release/RELEASE_NOTES.md \
              "${ASSETS[@]}"
          fi
