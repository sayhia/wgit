name: Release artifacts

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      release: ${{ steps.resolve.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CONFIG_VERSION=$(awk '/^  version:/ { gsub(/["'"'"']/, "", $2); print $2; exit }' build/config.yml)
          echo "build/config.yml info.version: ${CONFIG_VERSION}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "${VERSION}" != "${CONFIG_VERSION}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} says ${VERSION} but build/config.yml says ${CONFIG_VERSION}. Bump the config on main and re-tag; the About box reads the config value."
              exit 1
            fi
            {
              echo "version=${VERSION}"
              echo "tag=${GITHUB_REF_NAME}"
              echo "release=true"
            } >> "$GITHUB_OUTPUT"
          else
            # A version bump on main is the release trigger: if the matching
            # tag does not exist yet, build the release artifacts and let the
            # release job create the tag + GitHub Release. An existing release
            # that already carries the current per-arch artifact set keeps
            # producing smoke artifacts only; a release missing any of those
            # files (e.g. an older universal-only cut) is rebuilt so the
            # published assets converge on the current packaging layout.
            TAG="v${CONFIG_VERSION}"
            RELEASE_COMPLETE=false
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 &&
              EXISTING_ASSETS="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' 2>/dev/null)"; then
              RELEASE_COMPLETE=true
              for expected in \
                "wgit-${CONFIG_VERSION}-darwin-amd64.dmg" \
                "wgit-${CONFIG_VERSION}-darwin-arm64.dmg" \
                "wgit-${CONFIG_VERSION}-windows-amd64-installer.exe" \
                "wgit-${CONFIG_VERSION}-windows-arm64-installer.exe"; do
                if ! printf '%s\n' "${EXISTING_ASSETS}" | grep -qxF "${expected}"; then
                  echo "Release ${TAG} is missing ${expected}; scheduling a re-cut."
                  RELEASE_COMPLETE=false
                  break
                fi
              done
            fi
            if [ "${RELEASE_COMPLETE}" = "true" ]; then
              {
                echo "version="
                echo "tag="
                echo "release=false"
              } >> "$GITHUB_OUTPUT"
            else
              {
                echo "version=${CONFIG_VERSION}"
                echo "tag=${TAG}"
                echo "release=true"
              } >> "$GITHUB_OUTPUT"
            fi
          fi

  verify:
    name: Verify source before packaging
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Keep parity with ci.yml's backend job: the Linux runner has no
      # gtk4/webkitgtk headers, while server mode is pure Go.
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # TestGitService inspects the repository itself (HEAD~1 ranges, tags);
          # the default shallow checkout has only one grafted commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: configure git identity for tests
        run: |
          git config --global user.name "wgit CI"
          git config --global user.email "ci@wgit.local"
          git config --global commit.gpgsign false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: shellcheck (packaging scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -S info -s bash "${files[@]}"
          else
            echo "no shell scripts to lint"
          fi

      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      # main.go embeds frontend/dist; a clean checkout has no dist directory.
      - name: satisfy the frontend embed directive
        run: mkdir -p frontend/dist && touch frontend/dist/.ci-placeholder

      - name: go vet
        run: go vet -tags server ./...

      - name: go test
        run: go test -tags server ./... -count=1

      - name: install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: typecheck
        working-directory: frontend
        run: bun run typecheck

      # finalDeliveryVerification.test.ts and the bundle budget both need dist.
      - name: build frontend bundle
        working-directory: frontend
        run: bun run build

      - name: frontend tests
        working-directory: frontend
        run: bun test tests

  macos:
    name: macOS DMGs (amd64 + arm64)
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [version, verify]
    env:
      # Empty on forks and until the Apple credentials are configured; the
      # inline sign step then ad-hoc signs and labels the artifact as not
      # distributable, so the packaging chain stays observable either way.
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_NOTARY_PROFILE: ${{ secrets.APPLE_NOTARY_PROFILE }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The metadata step reads the tag for the version string.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build

      - name: Resolve build metadata
        id: meta
        env:
          VERSION: ${{ needs.version.outputs.version }}
          # Both slices are built on every push so Intel and Apple Silicon get
          # their own app bundle and DMG; nothing is lipo'd together.
          ARCHS: arm64 amd64
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONFIG_VERSION="$(awk '/^  version:/ { gsub(/["'"'"']/, "", $2); print $2; exit }' build/config.yml)"
          CONFIG_VERSION="${CONFIG_VERSION:-0.0.0}"
          if [ -z "${VERSION}" ]; then
            if TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
              VERSION="${TAG#v}"
            else
              VERSION="${CONFIG_VERSION}-dev.${COMMIT}"
            fi
          fi
          ARCH_LIST="$(echo "${ARCHS}" | tr -s ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          [ -n "${ARCH_LIST}" ] || { echo "::error::ARCHS is empty"; exit 1; }
          for arch in ${ARCH_LIST}; do
            case "${arch}" in
              arm64 | amd64) ;;
              *) echo "::error::unsupported ARCHS entry '${arch}'"; exit 1 ;;
            esac
          done
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "build_date=${BUILD_DATE}"
            echo "archs=${ARCH_LIST}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and bundle apps
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          ARCHS: ${{ steps.meta.outputs.archs }}
        run: |
          set -euo pipefail
          [ -n "$(ls -A frontend/dist 2>/dev/null)" ] || { echo "::error::frontend/dist is empty"; exit 1; }
          mkdir -p bin dist
          LDFLAGS="-s -w -X main.AppVersion=${VERSION} -X main.CommitHash=${COMMIT} -X main.BuildDate=${BUILD_DATE}"
          for arch in ${ARCHS}; do
            echo "==> Compiling darwin/${arch} (-tags production embeds frontend/dist)"
            CGO_ENABLED=1 GOOS=darwin GOARCH="${arch}" \
              CGO_CFLAGS="-mmacosx-version-min=12.0" \
              CGO_LDFLAGS="-mmacosx-version-min=12.0" \
              MACOSX_DEPLOYMENT_TARGET="12.0" \
              go build -tags production -trimpath -buildvcs=false -ldflags "${LDFLAGS}" \
                -o "bin/wgit-${arch}" .
          done
          for arch in ${ARCHS}; do
            APP_DIR="bin/wgit-${arch}.app"
            rm -rf "${APP_DIR}"
            mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources"
            cp "bin/wgit-${arch}" "${APP_DIR}/Contents/MacOS/wgit"
            chmod +x "${APP_DIR}/Contents/MacOS/wgit"
            cp build/darwin/Info.plist "${APP_DIR}/Contents/Info.plist"
            cp build/darwin/icons.icns "${APP_DIR}/Contents/Resources/icons.icns"
            if [ -f build/darwin/Assets.car ]; then
              cp build/darwin/Assets.car "${APP_DIR}/Contents/Resources/Assets.car"
            fi
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "${APP_DIR}/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${COMMIT}" "${APP_DIR}/Contents/Info.plist"
            plutil -lint "${APP_DIR}/Contents/Info.plist" >/dev/null
            printf '{\n  "version": "%s",\n  "commit": "%s",\n  "buildDate": "%s",\n  "arch": "%s",\n  "bundleId": "com.wgit.app"\n}\n' \
              "${VERSION}" "${COMMIT}" "${BUILD_DATE}" "${arch}" \
              > "${APP_DIR}/Contents/Resources/build-info.json"
          done

      - name: Sign, notarize, and package DMGs
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHS: ${{ steps.meta.outputs.archs }}
          ENTITLEMENTS: build/darwin/entitlements.plist
        run: |
          set -euo pipefail
          IDENTITY="${APPLE_SIGNING_IDENTITY:-}"
          NOTARIZE="${NOTARIZE:-auto}"
          log() { echo "==> $*"; }
          die() { echo "Error: $*" >&2; exit 1; }

          WORK_DIR="$(mktemp -d "${TMPDIR:-/tmp}/wgit-sign.XXXXXX")"
          STAGING=""
          KEYCHAIN=""
          P8_FILE=""
          EXISTING_KEYCHAINS=()
          cleanup() {
            if [ -n "${STAGING}" ]; then
              rm -rf "${STAGING}" 2>/dev/null || true
            fi
            if [ -n "${KEYCHAIN}" ]; then
              security delete-keychain "${KEYCHAIN}" >/dev/null 2>&1 || true
              if [ ${#EXISTING_KEYCHAINS[@]} -gt 0 ]; then
                security list-keychains -d user -s "${EXISTING_KEYCHAINS[@]}" >/dev/null 2>&1 || true
              fi
            fi
            if [ -n "${P8_FILE}" ]; then
              rm -f "${P8_FILE}" 2>/dev/null || true
            fi
            rm -rf "${WORK_DIR}"
          }
          trap cleanup EXIT

          if [ -n "${IDENTITY}" ] && [ -n "${APPLE_CERT_P12_BASE64:-}" ]; then
            log "Importing the Developer ID certificate into a temporary keychain"
            while IFS= read -r line; do
              trimmed="$(printf '%s' "${line}" | tr -d '\"' | sed -e 's/^ *//' -e 's/[ \t]*$//')"
              [ -n "${trimmed}" ] && EXISTING_KEYCHAINS+=("${trimmed}")
            done < <(security list-keychains -d user 2>/dev/null || true)
            KEYCHAIN="${WORK_DIR}/wgit-sign.keychain-db"
            KEYCHAIN_PASSWORD="${APPLE_KEYCHAIN_PASSWORD:-$(openssl rand -hex 16)}"
            security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN}"
            security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
            echo "${APPLE_CERT_P12_BASE64}" | base64 --decode > "${WORK_DIR}/developer.p12"
            security import "${WORK_DIR}/developer.p12" -P "${APPLE_CERT_PASSWORD:-}" \
              -A -f pkcs12 -k "${KEYCHAIN}" >/dev/null
            # Without this, codesign asks for an interactive ACL unlock on a headless runner.
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
            security list-keychains -d user -s "${KEYCHAIN}" "${EXISTING_KEYCHAINS[@]}"
          fi

          NOTARY_ARGS=()
          if [ -n "${IDENTITY}" ]; then
            if [ -n "${APPLE_API_KEY_BASE64:-}" ]; then
              P8_FILE="${WORK_DIR}/AuthKey.p8"
              echo "${APPLE_API_KEY_BASE64}" | base64 --decode > "${P8_FILE}"
              chmod 600 "${P8_FILE}"
            fi
            P8_FILE="${P8_FILE:-${APPLE_API_KEY_FILE:-}}"
            if [ -n "${P8_FILE}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
              NOTARY_ARGS=(--key "${P8_FILE}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}")
            elif [ -n "${APPLE_NOTARY_PROFILE:-}" ]; then
              NOTARY_ARGS=(--keychain-profile "${APPLE_NOTARY_PROFILE}")
            fi
          fi

          sign_and_notarize() {
            TARGET="$1"
            case "${TARGET}" in
              *.app)
                TARGET_KIND=app
                [ -f "${ENTITLEMENTS}" ] || die "entitlements file missing: ${ENTITLEMENTS}"
                ;;
              *.dmg) TARGET_KIND=dmg ;;
              *) die "unsupported target type (expected .app or .dmg): ${TARGET}" ;;
            esac

            if [ -z "${IDENTITY}" ]; then
              if [ "${TARGET_KIND}" = app ]; then
                log "No APPLE_SIGNING_IDENTITY: ad-hoc signing (local testing only)"
                codesign --force --sign - --entitlements "${ENTITLEMENTS}" "${TARGET}"
              else
                log "No APPLE_SIGNING_IDENTITY: leaving ${TARGET} unsigned"
              fi
              echo "[UNSIGNED] Set APPLE_SIGNING_IDENTITY (and notary credentials) for a distributable artifact."
              return 0
            fi

            TEAM_ID="${APPLE_TEAM_ID:-$(printf '%s' "${IDENTITY}" | sed -nE 's/.*\(([A-Z0-9]+)\)$/\1/p')}"
            local SUBMIT_TARGET=""
            if [ "${TARGET_KIND}" = app ]; then
              log "Signing the inner executable, then the bundle (hardened runtime)"
              # Signing the bundle after its executable beats the deprecated --deep walk.
              codesign --force --timestamp --options runtime --entitlements "${ENTITLEMENTS}" \
                --sign "${IDENTITY}" "${TARGET}/Contents/MacOS"/*
              codesign --force --timestamp --options runtime --entitlements "${ENTITLEMENTS}" \
                --sign "${IDENTITY}" "${TARGET}"
              SUBMIT_TARGET="${WORK_DIR}/$(basename "${TARGET}" .app).zip"
              ditto -c -k --keepParent "${TARGET}" "${SUBMIT_TARGET}"
            else
              log "Signing the disk image"
              codesign --force --timestamp --sign "${IDENTITY}" "${TARGET}"
              SUBMIT_TARGET="${TARGET}"
            fi

            log "Verifying the signature"
            codesign --verify --strict --verbose=2 "${TARGET}"

            if [ "${NOTARIZE}" = false ]; then
              echo "WARNING: NOTARIZE=false - Gatekeeper will block this artifact outside the build machine."
              return 0
            fi

            if [ ${#NOTARY_ARGS[@]} -eq 0 ]; then
              if [ "${NOTARIZE}" = true ]; then
                die "NOTARIZE=true but no notary credentials (APPLE_API_KEY_BASE64 + APPLE_API_KEY_ID + APPLE_API_ISSUER, or APPLE_NOTARY_PROFILE)"
              fi
              echo "WARNING: signed but not notarized (no notary credentials found)."
              return 0
            fi

            log "Submitting to Apple notary service"
            RESULT_JSON="${WORK_DIR}/notary-$(basename "${TARGET}").json"
            # --wait exits non-zero on rejection; the JSON still carries the id
            # needed for Apple's diagnostic log, so judge by the status field.
            xcrun notarytool submit "${SUBMIT_TARGET}" "${NOTARY_ARGS[@]}" --wait --output-format json > "${RESULT_JSON}" || true
            local STATUS ID
            read -r STATUS ID < <(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d.get("status","Unknown"), d.get("id",""))' "${RESULT_JSON}" 2>/dev/null || printf 'Unreadable unknown\n')
            if [ "${STATUS}" != "Accepted" ]; then
              echo "Notarization status: ${STATUS} (submission ${ID:-unknown})" >&2
              if [ -n "${ID:-}" ] && [ "${ID}" != "unknown" ]; then
                xcrun notarytool log "${ID}" "${NOTARY_ARGS[@]}" || true
              fi
              die "notarization failed for ${TARGET}"
            fi

            log "Stapling the notarization ticket"
            xcrun stapler staple "${TARGET}"
            xcrun stapler validate "${TARGET}"

            log "Gatekeeper assessment"
            if spctl -a -vvv -t install "${TARGET}"; then
              echo "    accepted"
            else
              die "Gatekeeper rejected ${TARGET}"
            fi
            echo " Signed and notarized: ${TARGET}"
            echo " Team: ${TEAM_ID:-unknown}"
          }

          mkdir -p dist
          : > dist/sha256sums.txt
          for arch in ${ARCHS}; do
            APP_DIR="bin/wgit-${arch}.app"
            DMG_NAME="wgit-${VERSION}-darwin-${arch}.dmg"
            sign_and_notarize "${APP_DIR}"
            STAGING="$(mktemp -d "${TMPDIR:-/tmp}/wgit-dmg-${arch}.XXXXXX")"
            cp -R "${APP_DIR}" "${STAGING}/wgit.app"
            ln -s /Applications "${STAGING}/Applications"
            rm -f "dist/${DMG_NAME}"
            hdiutil create -volname wgit -srcfolder "${STAGING}" -ov -format UDZO "dist/${DMG_NAME}"
            hdiutil verify "dist/${DMG_NAME}" >/dev/null
            rm -rf "${STAGING}"
            STAGING=""
            sign_and_notarize "dist/${DMG_NAME}"
            (
              cd dist
              shasum -a 256 "${DMG_NAME}" >> sha256sums.txt
            )
            echo "SHA-256: $(shasum -a 256 "dist/${DMG_NAME}" | cut -d' ' -f1)"
          done
          (cd dist && shasum -a 256 -c sha256sums.txt)

      - name: Artifact gates
        run: |
          (cd dist && shasum -a 256 -c sha256sums.txt)
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          [ ${#dmgs[@]} -eq 2 ] || { echo "::error::expected two DMGs, got ${#dmgs[@]}"; exit 1; }
          for dmg in "${dmgs[@]}"; do
            size=$(wc -c < "$dmg")
            echo "dmg: ${dmg} (${size} bytes)"
            # Each slice measured ~9 MB; a jump past this ceiling means an asset
            # got duplicated into the bundle, not that the app grew.
            if [ "$size" -gt 40000000 ]; then
              echo "::error::DMG exceeded 40 MB"
              exit 1
            fi
          done

      - name: Signature status
        run: |
          {
            for dmg in dist/*.dmg; do
              echo "artifact: ${dmg}"
            done
            for app in bin/wgit-*.app; do
              codesign -dvv "${app}" 2>&1 || true
            done
            for dmg in dist/*.dmg; do
              xcrun stapler validate "${dmg}" 2>&1 || echo "no stapled ticket: ${dmg} is NOT notarized"
              spctl -a -vvv -t install "${dmg}" 2>&1 || echo "Gatekeeper: rejected ${dmg} (expected for an unsigned build)"
            done
          } > dist/signature-status.txt
          cat dist/signature-status.txt

      - uses: actions/upload-artifact@v4
        with:
          name: wgit-macos-dmg
          path: |
            dist/*.dmg
            dist/sha256sums.txt
            dist/signature-status.txt
          retention-days: 30
          if-no-files-found: error

      # Upload first so a failed tag build still leaves the DMG and signature
      # report downloadable. A Developer ID signature without a notarization
      # ticket is still blocked by Gatekeeper, so the job must fail here.
      - name: Require notarization when signing is configured
        if: env.APPLE_SIGNING_IDENTITY != ''
        run: |
          for dmg in dist/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl -a -vvv -t install "$dmg"
          done

  server:
    name: Server binary (linux/${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [version, verify]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: build frontend bundle
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Build
        env:
          VERSION: ${{ needs.version.outputs.version }}
        # Server mode is pure Go (no WebKit), so CGO stays off and the binary
        # runs on the distroless base image in Dockerfile.server.
        run: |
          COMMIT="$(git rev-parse --short HEAD)"
          BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          VERSION="${VERSION:-$(git describe --tags --always)}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build \
            -tags server,production -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.AppVersion=${VERSION} -X main.CommitHash=${COMMIT} -X main.BuildDate=${BUILT}" \
            -o "dist/wgit-server-linux-${{ matrix.arch }}" .
          cp build/docker/Dockerfile.server dist/
          (
            cd dist || exit 1
            tar czf "wgit-server-linux-${{ matrix.arch }}.tar.gz" \
              "wgit-server-linux-${{ matrix.arch }}" Dockerfile.server
            # The release job also runs on Ubuntu; sha256sum is part of coreutils
            # and avoids relying on the optional Perl shasum shim.
            sha256sum "wgit-server-linux-${{ matrix.arch }}.tar.gz" >> sha256sums.txt
            sha256sum -c sha256sums.txt
          )

      - uses: actions/upload-artifact@v4
        with:
          name: wgit-server-linux-${{ matrix.arch }}
          path: |
            dist/wgit-server-linux-${{ matrix.arch }}.tar.gz
            dist/sha256sums.txt
          retention-days: 30
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    needs: [version, verify]
    env:
      # amd64 and arm64 ship as two separate installers; both are built on
      # every push so the ARM64 path is exercised on smoke runs too.
      ARCHS: amd64 arm64
    steps:
      - uses: actions/checkout@v4
        with:
          # The metadata step falls back to git describe for smoke builds.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build

      - name: Install Wails CLI
        shell: bash
        run: |
          set -euo pipefail
          # Pin the CLI to the library version in go.mod so the generated syso
          # and the linked runtime agree.
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          echo "Installing wails3 ${WAILS_VERSION}"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          wails3 version

      - name: Resolve build metadata
        id: meta
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONFIG_VERSION="$(awk '/^  version:/ { gsub(/["'"'"']/, "", $2); print $2; exit }' build/config.yml)"
          CONFIG_VERSION="${CONFIG_VERSION:-0.0.0}"
          if [ -z "${VERSION}" ]; then
            if TAG="$(git describe --tags --exact-match HEAD 2>/dev/null)"; then
              VERSION="${TAG#v}"
            else
              VERSION="${CONFIG_VERSION}-dev.${COMMIT}"
            fi
          fi
          # The Win32 version resource is numeric; a -dev.<sha> suffix stays in
          # the display strings only.
          FILE_VERSION="${VERSION%%-*}"
          if ! printf '%s' "${FILE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::cannot derive a 3-part numeric Windows file version from '${VERSION}'"
            exit 1
          fi
          ARCH_LIST="$(echo "${ARCHS}" | tr -s ' ' | sed -e 's/^ *//' -e 's/ *$//')"
          [ -n "${ARCH_LIST}" ] || { echo "::error::ARCHS is empty"; exit 1; }
          for arch in ${ARCH_LIST}; do
            case "${arch}" in
              amd64 | arm64) ;;
              *) echo "::error::unsupported ARCHS entry '${arch}'"; exit 1 ;;
            esac
          done
          INSTALLER_PREFIX="wgit-${VERSION}-windows"
          {
            echo "version=${VERSION}"
            echo "commit=${COMMIT}"
            echo "build_date=${BUILD_DATE}"
            echo "file_version=${FILE_VERSION}"
            echo "archs=${ARCH_LIST}"
            echo "installer_prefix=${INSTALLER_PREFIX}"
          } >> "$GITHUB_OUTPUT"

      - name: Build binaries and NSIS installer
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          FILE_VERSION: ${{ steps.meta.outputs.file_version }}
          ARCHS: ${{ steps.meta.outputs.archs }}
          INSTALLER_PREFIX: ${{ steps.meta.outputs.installer_prefix }}
        run: |
          set -euo pipefail
          [ -n "$(ls -A frontend/dist 2>/dev/null)" ] || { echo "::error::frontend/dist is empty"; exit 1; }
          mkdir -p bin dist

          # Win32 version resource: keep Explorer's file properties aligned with
          # build/config.yml instead of the template defaults.
          cat > build/windows/info.json <<EOF
          {
            "fixed": { "file_version": "${FILE_VERSION}" },
            "info": {
              "0000": {
                "ProductVersion": "${VERSION}",
                "CompanyName": "wgit",
                "FileDescription": "Universal Git Client",
                "LegalCopyright": "(c) 2026, wgit",
                "ProductName": "wgit",
                "Comments": "Modern Universal Git Client"
              }
            }
          }
          EOF

          LDFLAGS="-s -w -H windowsgui -X main.AppVersion=${VERSION} -X main.CommitHash=${COMMIT} -X main.BuildDate=${BUILD_DATE}"

          # Not part of the windows-latest image; the bundled bootstrapper lets
          # the installer provision WebView2 on a clean machine. Chocolatey
          # installs to Program Files without a shim, so invoke it by path.
          NSIS_DIR="/c/Program Files (x86)/NSIS"
          if command -v makensis >/dev/null 2>&1; then
            MAKENSIS="makensis"
          else
            choco install nsis --no-progress -y
            MAKENSIS="${NSIS_DIR}/makensis.exe"
          fi
          [ -x "${MAKENSIS}" ] || { echo "::error::makensis not found after installing NSIS"; exit 1; }
          "${MAKENSIS}" -VERSION
          wails3 generate webview2bootstrapper -dir build/windows/nsis

          for arch in ${ARCHS}; do
            echo "==> Compiling windows/${arch} (-tags production embeds frontend/dist)"
            (
              cd build
              wails3 generate syso -arch "${arch}" -icon windows/icon.ico \
                -manifest windows/wails.exe.manifest -info windows/info.json \
                -out "../wails_windows_${arch}.syso"
            )
            CGO_ENABLED=0 GOOS=windows GOARCH="${arch}" \
              go build -tags production -trimpath -buildvcs=false -ldflags "${LDFLAGS}" \
                -o "bin/wgit-${arch}.exe" .
            rm -f "wails_windows_${arch}.syso"

            # One installer per architecture: project.nsi derives ARCH from the
            # single binary define. NSIS resolves File paths with native
            # separators only, hence cygpath.
            case "${arch}" in
              amd64) ARCH_FLAG=AMD64 ;;
              arm64) ARCH_FLAG=ARM64 ;;
            esac
            BINARY_WIN="$(cygpath -w "$(pwd)/bin/wgit-${arch}.exe")"
            (
              cd build/windows/nsis
              "${MAKENSIS}" -DINFO_COMPANYNAME=wgit \
                -DINFO_PRODUCTNAME=wgit \
                -DINFO_PROJECTNAME=wgit \
                -DINFO_PRODUCTVERSION="${FILE_VERSION}" \
                "-DINFO_COPYRIGHT=(c) 2026, wgit" \
                "-DARG_WAILS_${ARCH_FLAG}_BINARY=${BINARY_WIN}" \
                project.nsi
            )
            mv "bin/wgit-${arch}-installer.exe" "dist/${INSTALLER_PREFIX}-${arch}-installer.exe"
          done

          for arch in ${ARCHS}; do
            [ -f "dist/${INSTALLER_PREFIX}-${arch}-installer.exe" ] || { echo "::error::missing ${arch} installer"; exit 1; }
          done
          ls -lh bin dist
          (
            cd dist
            sha256sum ./*-installer.exe > sha256sums.txt
            sha256sum -c sha256sums.txt
          )

      - name: Artifact gates
        shell: bash
        run: |
          (cd dist && sha256sum -c sha256sums.txt)
          shopt -s nullglob
          installers=(dist/*-installer.exe)
          [ ${#installers[@]} -ge 1 ] || { echo "::error::no Windows installer produced"; exit 1; }
          for installer in "${installers[@]}"; do
            size=$(wc -c < "$installer")
            echo "installer: ${installer} (${size} bytes)"
            # The per-arch build was ~14 MB when this gate was added; a jump to
            # 80 MB means assets were duplicated into the bundle.
            if [ "$size" -gt 80000000 ]; then
              echo "::error::Windows installer exceeded 80 MB"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: wgit-windows-installer
          path: |
            dist/*.exe
            dist/sha256sums.txt
          retention-days: 30
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [version, verify, macos, server, windows]
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wgit-*"
          path: artifacts

      - name: Assemble
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Verify each packaging job's own checksum before merging; a corrupted
          # download must fail here, not after the release is published.
          while IFS= read -r sums; do
            (cd "$(dirname "$sums")" && sha256sum -c sha256sums.txt)
          done < <(find artifacts -name sha256sums.txt -type f)

          mkdir -p release
          find artifacts -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*-installer.exe' \) -exec cp {} release/ \;
          dmg_amd64_count=$(find release -maxdepth 1 -name '*-darwin-amd64.dmg' -type f | wc -l | tr -d ' ')
          dmg_arm64_count=$(find release -maxdepth 1 -name '*-darwin-arm64.dmg' -type f | wc -l | tr -d ' ')
          tar_count=$(find release -maxdepth 1 -name '*.tar.gz' -type f | wc -l | tr -d ' ')
          exe_amd64_count=$(find release -maxdepth 1 -name '*-windows-amd64-installer.exe' -type f | wc -l | tr -d ' ')
          exe_arm64_count=$(find release -maxdepth 1 -name '*-windows-arm64-installer.exe' -type f | wc -l | tr -d ' ')
          [ "$dmg_amd64_count" -eq 1 ] || { echo "::error::expected one macOS amd64 DMG, got ${dmg_amd64_count}"; exit 1; }
          [ "$dmg_arm64_count" -eq 1 ] || { echo "::error::expected one macOS arm64 DMG, got ${dmg_arm64_count}"; exit 1; }
          [ "$tar_count" -eq 2 ] || { echo "::error::expected two Linux server tarballs, got ${tar_count}"; exit 1; }
          [ "$exe_amd64_count" -eq 1 ] || { echo "::error::expected one Windows amd64 installer, got ${exe_amd64_count}"; exit 1; }
          [ "$exe_arm64_count" -eq 1 ] || { echo "::error::expected one Windows arm64 installer, got ${exe_arm64_count}"; exit 1; }
          sig=$(find artifacts -name signature-status.txt -type f | head -1)
          [ -n "$sig" ] || { echo "::error::signature-status.txt is missing"; exit 1; }
          cp "$sig" release/signature-status.txt
          {
            echo "version: ${TAG#v}"
            echo "tag: ${TAG}"
            echo "commit: ${GITHUB_SHA}"
            echo "ref: ${GITHUB_REF}"
            echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > release/build-metadata.txt

          cd release
          sha256sum ./*.dmg ./*.tar.gz ./*-installer.exe > sha256sums.txt
          sha256sum -c sha256sums.txt
          {
            echo "## wgit ${TAG}"
            echo
            echo "| artifact | purpose |"
            echo "| --- | --- |"
            echo "| \`$(find . -maxdepth 1 -name '*-darwin-amd64.dmg' -printf '%f\n' | head -1)\` | macOS Intel desktop app (drag to Applications) |"
            echo "| \`$(find . -maxdepth 1 -name '*-darwin-arm64.dmg' -printf '%f\n' | head -1)\` | macOS Apple Silicon desktop app (drag to Applications) |"
            echo "| \`$(find . -maxdepth 1 -name '*-windows-amd64-installer.exe' -printf '%f\n' | head -1)\` | Windows x64 desktop app (NSIS installer, WebView2 bootstrapper included) |"
            echo "| \`$(find . -maxdepth 1 -name '*-windows-arm64-installer.exe' -printf '%f\n' | head -1)\` | Windows on ARM desktop app (NSIS installer, WebView2 bootstrapper included) |"
            echo "| \`wgit-server-linux-*.tar.gz\` | headless server mode + \`Dockerfile.server\` |"
            echo
            echo "Verification: \`sha256sum -c sha256sums.txt\` on Linux/Windows, \`shasum -a 256 -c sha256sums.txt\` on macOS."
            echo
            echo "### Signature"
            echo
            echo '```'
            cat signature-status.txt
            echo '```'
            echo
            echo "The Windows installer is not Authenticode-signed; SmartScreen may warn on first run."
            echo
            echo "### Build metadata"
            echo
            echo '```'
            cat build-metadata.txt
            echo '```'
            echo
            echo "Data lives in \`~/.config/wgit/\` (\`%USERPROFILE%\\.config\\wgit\\\` on Windows) plus the WebView container;"
            echo "deleting the app and that directory is a complete uninstall."
          } > RELEASE_NOTES.md
          ls -lh
          cat RELEASE_NOTES.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repository from a
          # git remote; GITHUB_REPOSITORY is the only stable source here.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          PRE=""
          case "${TAG}" in
            *-rc.* | *-beta* | *-alpha*) PRE="--prerelease" ;;
          esac
          ASSETS=(release/*.dmg release/*.tar.gz release/*-installer.exe release/sha256sums.txt release/build-metadata.txt release/signature-status.txt)
          # Re-running a release must converge: upload over an existing release
          # instead of failing on "release already exists".
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            if [ -n "${PRE}" ]; then
              gh release edit "${TAG}" --notes-file release/RELEASE_NOTES.md --prerelease
            else
              gh release edit "${TAG}" --notes-file release/RELEASE_NOTES.md
            fi
            # A re-cut must converge: drop assets from the previous cut that
            # this run no longer produces (e.g. the universal DMG replaced by
            # per-arch files) instead of leaving both generations downloadable.
            keep_names=()
            for path in "${ASSETS[@]}"; do
              keep_names+=("$(basename "${path}")")
            done
            gh release view "${TAG}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              if ! printf '%s\n' "${keep_names[@]}" | grep -qxF "${asset}"; then
                echo "Removing stale release asset: ${asset}"
                gh release delete-asset "${TAG}" "${asset}" --yes
              fi
            done
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" ${PRE} \
              --title "wgit ${TAG}" \
              --notes-file release/RELEASE_NOTES.md \
              "${ASSETS[@]}"
          else
            # Version bump on main: create the tag at the commit that produced
            # these artifacts, then publish the release in one step.
            gh release create "${TAG}" ${PRE} \
              --target "${GITHUB_SHA}" \
              --title "wgit ${TAG}" \
              --notes-file release/RELEASE_NOTES.md \
              "${ASSETS[@]}"
          fi
