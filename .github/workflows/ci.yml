name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The `audit` job below only runs on schedule/dispatch; without a cron here it
  # would never run at all.
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: shellcheck (packaging scripts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shopt -s nullglob
          files=(scripts/*.sh)
          if [ ${#files[@]} -gt 0 ]; then
            shellcheck -S info -s bash "${files[@]}"
          else
            echo "no shell scripts to lint"
          fi

      - name: actionlint
        # `go run` instead of a container: anonymous Docker Hub pulls are
        # rate-limited from shared runner IPs, which is how a lint step turns
        # red without any finding in the workflows.
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  backend:
    name: Go service layer (vet, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Server mode is pure Go. With CGO on, the Linux runner tries to link the
      # WebKit shell and dies on missing gtk4/webkitgtk-6.0 pkg-config files;
      # the server Dockerfile builds the same way (CGO_ENABLED=0).
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
        with:
          # TestGitService inspects the repository itself (HEAD~1 ranges, tags)
          # and the default shallow checkout has only one grafted commit.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: configure git identity for tests
        run: |
          git config --global user.name "wgit CI"
          git config --global user.email "ci@wgit.local"
          git config --global commit.gpgsign false

      # main.go carries `//go:embed all:frontend/dist` and frontend/dist is
      # gitignored, so every Go command fails on a fresh checkout until the
      # directory exists. The service layer never reads the assets, so an
      # empty placeholder is enough here; the real bundle is embedded by the
      # packaging job in release.yml.
      - name: satisfy the frontend embed directive
        run: mkdir -p frontend/dist && touch frontend/dist/.ci-placeholder

      # `-tags server` selects the pure-Go build (the desktop shell needs
      # GTK/WebKit headers that a Linux runner does not have). The GUI-tagged
      # sources are compiled and packaged on macOS in release.yml.
      - name: go vet
        run: go vet -tags server ./...

      - name: go test
        run: go test -tags server ./... -count=1 -coverprofile=coverage.out

      - name: coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${total}%"
          # Floor is the measured baseline (78.0% of statements, same number
          # with and without -tags server) minus headroom for churn.
          awk -v c="$total" 'BEGIN { if (c + 0 < 77) { print "coverage below floor (77%)"; exit 1 } }'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-coverage
          path: coverage.out

  frontend:
    name: Frontend (typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      # Before the tests: tests/finalDeliveryVerification.test.ts asserts that
      # the production bundle exists, and the budget gate below reads its size.
      - name: build
        run: bun run build

      - name: bundle budget
        run: |
          # A regression here means a dependency crept into the entry chunk.
          entry=$(find dist/assets -name 'index-*.js' -type f | head -1)
          size=$(wc -c < "$entry")
          echo "entry chunk: ${entry} (${size} bytes)"
          if [ "$size" -gt 700000 ]; then
            echo "entry chunk exceeded 700 kB"
            exit 1
          fi

      - name: unit tests
        # Bun writes test output to stderr when CI=true; capture both streams so
        # the coverage gate sees the summary.
        run: |
          set -o pipefail
          bun test tests --coverage --coverage-reporter=text 2>&1 | tee coverage.txt

      - name: coverage gate
        run: |
          # Bun prints "All files | funcs% | lines% |"; ANSI color and report
          # layout can vary, so take the last number on the summary row.
          line=$(grep -a 'All files' coverage.txt | tail -1 | grep -oE '[0-9]+([.][0-9]+)?' | tail -1)
          if [ -z "$line" ]; then
            echo "::error::could not parse coverage summary"
            tail -40 coverage.txt
            exit 1
          fi
          echo "line coverage: ${line}%"
          # Floor is the measured baseline (78.4%) minus headroom for churn.
          awk -v c="$line" 'BEGIN { if (c + 0 < 77) { print "coverage below floor (77%)"; exit 1 } }'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage.txt
          if-no-files-found: ignore

  ai-e2e:
    name: AI E2E (real server, mock provider)
    runs-on: macos-latest
    timeout-minutes: 40
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: build frontend bundle
        working-directory: frontend
        run: bun run build

      - name: build server binary
        run: go build -tags "server,production" -trimpath -buildvcs=false -o bin/wgit-server .

      - name: install Chrome for Playwright
        working-directory: frontend
        run: bunx playwright install chrome

      - name: AI E2E
        working-directory: frontend
        # Pixel baselines come from one machine's font rasterizer, so the
        # pipeline runs the functional stream and uploads the screenshots;
        # `bun run audit:ai` locally still diffs them.
        env:
          AI_VISUAL: off
        run: bun run audit:ai

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-e2e-screenshots
          path: frontend/e2e/out/
          if-no-files-found: ignore

  audit:
    name: Browser audit (nightly / manual)
    # The deep pass drives a real Chrome through 138 layouts and takes minutes;
    # running it on every PR would just teach people to ignore red builds.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: boot dev server
        run: |
          bun run dev --port 9245 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9245/ >/dev/null; then
              echo "dev server ready"
              exit 0
            fi
            sleep 1
          done
          echo "::error::dev server did not answer within 60s"
          exit 1
      - name: contrast + a11y + glass audit
        run: bun run audit
        env:
          BASE_URL: http://127.0.0.1:9245/
